[default]
# Can application start?
run = yes

# Allow registrations
registrations = yes

# TODO [android] config - app; when connect other app, ...

[refresh]
# Save information before browser refresh (current slide, modal, ..) and then send them back
save = yes
# Time to save these information in seconds
time = 604800

# Image manager settings
[imng]
# Reclassify on start
reclassify = no
limit-dark = 60

# Set geographic position of current location
[position]
latitude = 49.638994
longitude = 17.148784

# Set log priorities
[logs]
log_only = false

changes_priority = 0
changes_edit_priority = 0
terminal_priority = 0
auth_priority = 0

# Make validations?
# TODO - some validations may not work
[validation]
json = yes
js = no
html = no
css = no

[doorbird]
active = no

ip = 172.16.0.5

username = aa
password = bb
