{% extends "auth/base.html" %}

{% block title %}{{ _("Login") }}{% endblock %}

{% block script %}
    <script type="text/javascript" src="{{ url_for('static', filename='js/login.js') }}" defer></script>
{% endblock %}

{% block centered %}
    <form id="login-form" autocomplete="off" action="{{ redirect }}">
        <p class="h4 mb-4">{{ _("Login") }}</p>
        <div class="form-field">
            <div class="field">
                <input id="username" type="text" class="input" autocomplete="off" placeholder=" " maxlength="40">
                <label for="username" class="label">{{ _("Username") }}</label>
            </div>

            <div class="field">
                <input id="password" type="password" class="input" autocomplete="off" placeholder=" " readonly onfocus="this.removeAttribute('readonly');" maxlength="80">
                <label for="password" class="label">{{ _("Password") }}</label>
            </div>
        </div>
        <button class="btn btn-info btn-block" type="button" id="login">{{ _("Login") }}</button>
        {% if registration == True %}
        <br>
            {{ _("Don't have an account?") }} <a href="{{ url_for('register') }}">{{ _("Register here") }}</a>
        {% endif %}
    </form>
{% endblock %}
