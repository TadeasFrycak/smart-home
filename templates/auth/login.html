{% extends "auth/base.html" %}

{% block title %}{{ _("Login") }}{% endblock %}

{% block content %}
    <script type="text/javascript" src="{{ url_for('static', filename='js/login.js') }}" defer></script>

    <div class="container">
        <form class="text-center" id="login-form" autocomplete="off" action="{{ redirect }}">
            <p class="h4 mb-4">{{ _("Login") }}</p>
            <div class="myField">
                <div class="field">
                    <input id="username" type="text" name="username" class="input" placeholder=" ">
                    <label for="username" class="label">{{ _("Username") }}</label>
                </div>

                <div class="field">
                    <input id="password" type="password" name="password" class="input" placeholder=" ">
                    <label for="password" class="label">{{ _("Password") }}</label>
                </div>
            </div>
            <!-- <div class="form-group">
                <div class="input-group mb-2 mr-sm-2">
                    <div class="input-group-prepend">
                        <div class="input-group-text"><img style="height:15px" src="{{ url_for('static', filename='img/static/user.png') }}" alt="User"></div>
                    </div>
                    <input type="text" id="username" class="form-control" placeholder="{{ _('Username') }}"> 
                </div>
            </div>

            <div class="form-group">
                <div class="input-group mb-2 mr-sm-2">
                    <div class="input-group-prepend">
                        <div class="input-group-text"><img style="height:18px" src="{{ url_for('static', filename='img/static/password.png') }}" alt="Password"></div>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="{{ _('Password') }}">
                </div>
            </div> -->

            <button class="btn btn-info btn-block" type="button" id="login">{{ _("Login") }}</button>
            <br>
            {{ _("Don't have an account?") }} <a href="{{ url_for('register') }}">{{ _("Register here") }}</a>
            <button class="btn btn-sm btn-light" type="button" style="position:absolute;right:54px;bottom:27px" id="incognito-login"><img style="width:23px" src="{{ url_for('static', filename='img/static/incognito.png') }}" alt="Anonymous"></button>
        </form>
    </div>
{% endblock %}
