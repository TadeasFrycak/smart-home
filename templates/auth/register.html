{% extends "auth/base.html" %}
{% block title %}{{ _("Registration") }}{% endblock %}

{% block content %}
    <script type="text/javascript" src="{{ url_for('static', filename='js/register.js') }}" defer></script>
    <div class="container">
        <form class="text-center" id="register-form" autocomplete="off" action="{{ redirect }}">
            <p class="h4 mb-4">{{ _("Registration") }}</p>

            <div class="myField">
                
                <div class="field">
                    <input id="first_name" type="text" name="first-name" class="input" placeholder=" ">
                    <label for="first-name" class="label">{{ _("First name") }}</label>
                </div>

                <div class="field">
                    <input id="last_name" type="text" name="last-name" class="input" placeholder=" ">
                    <label for="last-name" class="label">{{ _("Last name") }}</label>
                </div>

                <div class="field">
                    <input id="username" type="text" name="user-name" class="input" placeholder=" ">
                    <label for="user-name" class="label">{{ _("Username") }}</label>
                </div>

                <div class="field">
                    <input id="password" type="password" name="password" class="input" placeholder=" ">
                    <label for="password" class="label">{{ _("Password") }}</label>
                </div>

                <div class="field">
                    <input id="repeat_password" type="password" name="repeat_password" class="input" placeholder=" ">
                    <label for="repeat_password" class="label">{{ _("Repeat password") }}</label>
                </div>

                <div class="form-group">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input sex" type="radio" name="sex" id="female" value="female">
                        <label class="form-check-label" for="female">{{ _("Female") }}</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input sex" type="radio" name="sex" id="male" value="male">
                        <label class="form-check-label" for="male">{{ _("Male") }}</label>
                    </div>
                </div>
            </div>


            <button id="register" class="btn btn-info btn-block" type="button">{{ _("Register") }}</button>
            <br>
            {{ _("Already have an account?") }} <a href="{{ url_for('index') }}">{{ _("Login") }}</a>
        </form>
    </div>

    {% if introduction == True %}
        <div id="introduction" class="container text-center" style="font-size:55px;color:white;text-shadow: 0 0 8px #333;"></div>
        <script>
          $(".container").hide();
          setTimeout(() => {
              $("#introduction").text("{{ _("Good day!") }}").hide().fadeIn(1800);
              setTimeout(() => {
              $("#introduction").show().fadeOut(1800, function () {
                  $("#introduction").text("{{ _("This is Smart home") }}").hide().fadeIn(1800);
                  setTimeout(() => {
                  $("#introduction").show().fadeOut(1800, function () {
                      $("#introduction").text("{{ _("Please register to SH now!") }}").hide().fadeIn(1800);
                      setTimeout(() => {
                      $("#introduction").show().fadeOut(1800, function(){$("#register-form").hide().fadeIn(1800)});
                      }, 3800);
                  });
                  }, 3800);
              });
              }, 3000);
          }, 500);
        </script>
    {% endif %}
{% endblock %}
