<html>
    <head>
        <link rel="stylesheet" href="/static/bootstrap/bootstrap.min.css">

        <script src="/static/bootstrap/bootstrap.min.js"></script>
        
        <link rel="stylesheet" href="/static/dist/hexagon.css">

        <link rel="stylesheet" href="/static/main.css">

        <script type="text/javascript" src="/static/dist/hexagon.js"></script>

        <title>Document</title>

    <body>
        <div class="container">
            <!-- Tohle Bootstrap upravuje-->

            <header>
                IoT v10 for testing
            </header>


            <main>
                <div class="tile">
                    <div class="tileTextLayer">
                        <img src="/static/Img/icon-3-fan.png" class="tileImage">
                        <span class="tileDescription">DESK FAN</span>
                        <span class="tileStatus">OFF</span>
                    </div>
                    <div class="titeAtributes">test</div>
                    <div class="tileTouchLayer tileToggle tileModal"></div>
                </div>

                <div class="tile">
                    <div class="tileTextLayer">
                        <img src="/static/Img/icon-1-light-bulb.png" class="tileImage">
                        <span class="tileDescription">MY DESK LAMP</span>
                        <span class="tileStatus">OFF</span>
                    </div>
                    <div class="titeAtributes">test</div>
                    <div class="tileTouchLayer tileToggle tileModal"></div>
                </div>

                <div class="tile">
                    <div class="tileTextLayer">
                        <div class="tileInputVal">14<span style="font-size: 15px;"> %</span></div>
                        <span class="tileDescription">Humidity Bathroom</span>
                        <span class="tileStatus">1hr ago</span>
                    </div>
                    <div class="tileTouchLayer tileModal"></div>
                </div>

                <div class="tile">
                        <div class="tileTextLayer">
                            <div class="tileInputVal">23:59</div>
                            <span class="tileDescription">Alarm clock</span>
                            <span class="tileStatus">Active</span>
                        </div>
                        <div class="tileTouchLayer tileToggle tileModal"></div>
                    </div>


                <div class="tile">
                    <div class="tileTextLayer">
                        <div class="tileInputVal">255<span style="font-size: 15px;"> ml</div>
                        <span class="tileDescription">WATER LEVEL</span>
                    </div>
                    <div class="tileTouchLayer tileModal"></div>
                </div>


            </main> 






            <!-- The Modal -->
        <div id="tile-Modal" class="tile-modal">
            <!-- Modal content -->
            <div class="tile-modal-content">
            <span class="close">&times;</span>
            <div class="modalContent">
                <div class="modalHeader">UNDEFINED</div>
                <hr>

                <div class="sliderModule" data-id="0" >
                    <span class="sliderModuleLabel">Slider 1</span>
                    <div class="slider" class="hx-slider"></div>
                </div>

                <div class="sliderModule" data-id="0" >
                    <span class="sliderModuleLabel">Slider 2</span>
                    <div class="slider" class="hx-slider"></div>
                </div>
                <hr>

                <div class="toggleModule">This is a Toggle switch<div class="toggle"></div></div>
                <div class="toggleModule">This is a Toggle switch<div class="toggle"></div></div>
                <div class="toggleModule">This is a Toggle switch<div class="toggle"></div></div>
                <div class="toggleModule">This is a Toggle switch<div class="toggle"></div></div>
                <hr>

                <div class="graphModul" data-header="Last Week">
                        <canvas id="myChart"></canvas>
                </div>
                <hr>
                <div class="graphModul" data-header="Last Month">
                        <canvas id="myChart"></canvas>
                </div>
                <hr>


                <div class="modalTimer">Timer Settings
                    Timer
                    <input type="text" class="timepicker">
                </div>
            </div>
            </div>
        </div>


        </div>
