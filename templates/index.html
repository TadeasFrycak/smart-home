<!DOCTYPE html>
<html lang="en">
    
<head>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/buttons-style.css">
    <link rel="stylesheet" href="/static/page-style.css">
    <link rel="stylesheet" href="/static/slider-style.css">

    <!-- Swiper JS -->
    <script src="/static/swiper.min.js"></script>
    <script src="/static/jquery.js"></script>
    <script src="/static/script.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/swiper.min.css">
    
    <title>Document</title>

</head>

<body>
<!-- Swiper -->
  <div class="swiper-container">
        <div class="swiper-wrapper">

        <!-- First slide -->
          <div class="swiper-slide">
                <div class="Header">Obývák</div>
                <main id="1">
                </main>
          </div>

        <!-- Second slide -->
          <div class="swiper-slide">
                <div class="Header">Kuchyně</div>
                <main id="2"> 
                </main>
          </div>


        <!-- Third slide -->
          <div class="swiper-slide">
                <div class="Header">Můj pokoj</div>
                <main id="3"> 
                </main>
          </div>






          <div class="swiper-slide">
                <div class="item item-scroll overlay selectDisable">
                        <input class="slider" type="range" orient="vertical" min="0" max="210">
                        <div class="box"></div>
                        <img src="/static/Img/light-bulb.png" class="item-image">
                        <div class="item-header">TEST</div>
                        <div class="item-status">OFF</div>   
                    </div>

                <div class="item item-scroll">
                        <div class="item-header">DebugPanel</div>
                        <div class="debug">Null</div>
                    </div>

          </div>
          

        </div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>
      </div>
    
      
    

    
</body>
</html>
