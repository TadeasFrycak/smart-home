<div class="modal-item" data-id="{{ item.id }}" data-type="{{ item.type }}" data-value="{{ item.value }}" data-config='{{ item.config | tojson | safe }}' data-group="{{ group }}">
    <div class="form-group-sm row">
        <label class="col-lg-3 col-form-label">{{ item.config.label }}</label>
        <div class="input-group col-lg-9" style="margin-bottom: 10px;">
            <div class="modal-edit-icons">
                {% for icon in item.config.icons %}
                    <img alt="{{ _('Icon') }}" src="{{ url_for('static', filename='img/icons/'+icon) }}"
                         data-name="{{ icon }}" class="modal-edit-icon icon-invert {% if item.value == icon %}modal-edit-icon-active{% endif %}"
                         style="cursor: pointer;">
                {% endfor %}
            </div>
        </div>
    </div>
    <script type="text/javascript">
        $('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]').find(".modal-edit-icon").each(function() {
            Hammer(this).on("tap", function(elem) {
              $(".modal-edit-icon").removeClass("modal-edit-icon-active");
              $(elem.target).addClass("modal-edit-icon-active");
              store($(elem.target).closest(".modal-item"), "value", store($(elem.target), "name")).trigger("value-transmit");
            });
          });

        $('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]').on("value-receive", function() {
          $(".modal-edit-icon").removeClass("modal-edit-icon-active");
          $(this).find("img[data-name='" + store($(this), "value") + "']").addClass("modal-edit-icon-active");
        });
    </script>
</div>
