<div class="form-group-sm row">
    <label class="col-lg-3 col-form-label">{{ item.config.label }}</label>
    <div class="input-group col-lg-9" style="margin-bottom: 10px;">
        <div class="modal-edit-icons">
            {% for icon in item.config.icons %}
                <img alt="{{ _('Icon') }}" src="{{ url_for('static', filename='img/icons/'+icon) }}"
                     data-name="{{ icon }}" class="modal-edit-icon icon-invert {% if item.value == icon %}modal-edit-icon-active{% endif %}"
                     style="cursor: pointer;">
            {% endfor %}
        </div>
    </div>
</div>
