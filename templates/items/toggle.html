<div class="modal-item" data-id="{{ item.id }}" data-type="{{ item.type }}" data-value="{{ item.value }}" data-config='{{ item.config | tojson | safe }}' data-group="{{ group }}">
    <div class="modal-toggle">
        <div class="modal-toggle-label">
            {{ item.config.label }}
        </div>
        <div class="modal-toggle-input">
            <input id="{{ group }}-{{ item.id }}" type="checkbox" class="switch" {% if item.value %}checked{% endif %} {% if item.config.disabled %}disabled{% endif %}>
            <label for="{{ group }}-{{ item.id }}">{{ item.config.placeholder }}</label>
        </div>
    </div>

    <script type="text/javascript" defer>
        $('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]').on("change", ".switch", function() {
          store($(this).closest(".modal-item"), "value", $(this).prop("checked")).trigger("value-transmit");
        });

        $('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]').on("value-receive", function() {
          $(this).find(".switch").prop("checked", store($(this), "value") ? 1 : 0);
        });

        $('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]').on("config-receive", function() {
          let config = store($(this), "config");
          $(this).find(".switch").prop("disabled", config.disabled ? 1 : 0);
          $(this).find(".modal-toggle-label").text(config.label);
          $(this).find(".modal-toggle-input").find("label").text(config.placeholder);
        });
    </script>
</div>
