<div class="modal-toggle">
    <div class="modal-toggle-label">
        {{ item.config.label }}
    </div>
    <div class="modal-toggle-input">
        <input id="{{ group }}-{{ item.id }}" type="checkbox" class="switch" {% if item.value == item.config.on_value %}checked{% endif %} {% if item.config.disabled %}disabled{% endif %}>
        <label for="{{ group }}-{{ item.id }}">{{ item.config.placeholder }}</label>
    </div>
</div>
