<span class="modal-item" data-id="{{ item.id }}" data-type="{{ item.type }}" data-value='{{ item.value | tojson | safe }}' data-config='{{ item.config | tojson | safe }}' data-group="{{ group }}">
    {% include "items/" + item["type"] + ".html" %}

    <script type="text/javascript" defer>
      item($('.modal-item[data-id="{{ item.id }}"][data-group="{{ group }}"]'));
    </script>
</span>
