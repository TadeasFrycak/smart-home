<div class="form-group-sm row">
    <label class="col-lg-3 col-form-label">{{ item.config.label }}</label>
    <div class="col-lg-9">
        <select data-menu>
            {% for i in item.config.options %}
                <option {% if i == item.value %}selected{% endif %}>{{ i }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<br>
