<div class="progress">
    <div class="progress-bar progress-bar-striped bg-{{ item.data.color }}" role="progressbar"
         style="width: {{ item.data.value }}%" aria-valuenow="{{ item.data.value }}" aria-valuemin="{{ item.data.value_min }}"
         aria-valuemax="{{ item.data.value_max }}">{{ item.data.label }}</div>
</div>
