<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <input type="text" class="modal-title modal_edit_title form-control form-control-lg" id="tile_name" placeholder="Tile Name" value="::tile_name::">
            </div>
            <div class="modal-body">
                <form>
                    <div class='form-group-sm row'>
                        <label for="item-type" class='col-sm-3 col-form-label'>Typ itemu</label>
                        <div class='col-sm-9'>
                            <div style="left:5px" id="tile_type" class="btn-group btn-group-toggle" data-toggle="buttons"> <!--modal_edit_tile_types-->
                                ::tile_items::
                            </div>
                        </div>
                    </div>
                    <div class='form-group-sm row'>
                        <label for="item-id" class='col-sm-3 col-form-label'>ID itemu</label>
                        <div class='col-sm-9'>
                            <input id="tile_id" class='form-control form-control-sm' type='text' placeholder='::id_value::' value="::id_value::">
                        </div>
                    </div>

                    <div class='form-group-sm row'>
                        <label for="mqtt-path" class='col-sm-3 col-form-label'>MQTT cesta</label>
                        <div class='col-sm-9'>
                            <input id="tile_mqtt_path" class='form-control form-control-sm' type='text' placeholder='MQTT cesta' readonly>
                        </div>
                    </div>
                </form>

                    <hr>
                    <h6>Přidat modal itemy</h6>
                    <!--<span style="font-size: 15px; font-weight: bold; margin-bottom: 10px; line-height: 60px;">Přidat modal itemy</span><br>-->::modal_items::
                    <hr>
                    <!--<span style="font-size: 15px; font-weight: bold; margin-bottom: 10px; line-height: 60px;">Modal itemy</span><br>-->
                    <h6>Modal itemy</h6>

                    <div class="modal_items_edit">
                        <div id="example1" class="modal_items_edit_sortable list-group col">
                            ::content::
                            <script>
                                new Sortable(example1, {
                                    handle: '.handle', // handle's class
                                    animation: 150,

                                        onEnd: function (/**Event*/evt, /**Event*/originalEvent) {
                                            var old_index = evt.oldDraggableIndex;
                                            var new_index = evt.newDraggableIndex;
                                            var id_of_caller = $(".modalHere").attr("id_of_caller");

                                            console.log(old_index);
                                            console.log(new_index);
                                            console.log(id_of_caller);
                                            $.post( "/modal_item_index_rwr",
                                            {
                                                "id": id_of_caller,
                                                "old_index": old_index,
                                                "new_index": new_index
                                            });
                                            
                                        },
                                });
                            </script>
                        </div>

                    </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="scroll-up" class="mr-auto btn btn-light"><img src="/static/images/static/up.png" height="24"></button>
                <div class="btn-group">
                    <button type="button" id="unpack-items" class="btn btn-light btn-sm">Rozbalit vše</button>
                    <button type="button" id="collapse-items" class="btn btn-light btn-sm">Sbalit vše</button>
                </div>
                <button type="button" class="btn btn-outline-warning" data-dismiss="modal">Zavřít</button>
            </div>
        </div>
    </div>
</div>
