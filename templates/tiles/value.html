<div class="tile">
    <div class="tile-text">
        <div class="tile-display">
            <div class="tile-value-value tile-input-value">{{ tile.value.value|int }}</div>
            <span class="tile-value-suffix" style="font-size: 15px">{{ tile.value.suffix }}</span>
        </div>
        <span class="tile-label">{{ tile.label }}</span>
        <span class="tile-status">{% if tile.value.time %}{{ get_time_ago(tile.value.time) }}{% else %}{{ _("N/A") }}{% endif %}</span> <!-- TODO -->
    </div>
</div>
