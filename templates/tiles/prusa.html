<div class="tile" style="width:212px;">
    <div class="tile-text">
        <img alt="{{ _('Icon') }}" src="{{ url_for('static', filename='img/icons/prusa.png') }}" class="tile-icon" style="left: 20px;top: 10px; width: 50px; height: auto;">
        <div class="tile-label" style="max-width: 118px;width: 118px;height: 40px;position: absolute;left: 86px;top: 14px;overflow: hidden;">{{ tile.label }}</div>
    </div>
    <div class="prusa-status" style="width: 190px;height: 20px;position: absolute; left: 12px;top: 66px; overflow: hidden;word-break: break-all;font-size: 11px;">{{ tile.value.status }}</div>
    
    <div class="prusa-progress-bar" style="position: absolute; left: 12px; top:87px;">
        <div class="prusa-progress-bar-max" style="position: absolute; width:100px; height:3px; background-color:#868686;"></div>
        <div class="prusa-progress-bar-current" style="position: absolute; width:{{ tile.value.percentage }}px; height:3px; background-color:#424242;"></div> <!-- TODO v dark modu prohodit barvičky -->
        <div class="prusa-progress-bar-text" style="position: absolute; font-size:11px; left:106px; top:-6px; opacity: 80%; width: 88px"><span class="prusa-percentage">{{ tile.value.percentage }}</span>% (-<span class="prusa-time">{{ tile.value.time }}</span>)</div>
    </div>

    <div class="hotend-temp" style="position: absolute; top: 32px; left:86px">
        <!-- <div class="hotend-temp-title" style="position:absolute; font-size: 10px; top: 10px">H: </div> -->
        <div style="position:absolute; font-size: 12px; top: 10px; left: 0; width: 140px;">
            <span style="opacity: 80%">H:</span> <span class="prusa-hotend">{{ tile.value.hotend }}</span> °C &nbsp; <span style="opacity: 80%">B:</span> <span class="prusa-bed">{{ tile.value.bed }}</span> °C
{#            <span style="opacity: 80%">H:</span> {{ tile.value.hotend }} °C &nbsp; <span style="opacity: 80%">B:</span> {{ tile.value.bed }} °C#}
        </div>
    </div>
