<div class="grid-square">
    <div class="tile enable-hammer" data-id="{{ tile.id }}" style="width:212px;" data-type="{{ tile.type }}">
        <div class="tile-text">
            <img alt="{{ _('Icon') }}" src="{{ '/img/icons/'+tile.config.icon }}" class="tile-icon icon-invert" style="left: 27px;top: 16px">
            <div style="width: 100px;height: 40px;position: absolute;left: 100px;top: 14px;">
                <span class="tile-label" style="font-size: 18px;top: 0;height: 46px;width: 100px;">{{ tile.label }}</span>
            </div>
            <div style="position: absolute;top: 62px;left: 30px;font-size: 20px;"><span class="tile-value-left">{{ tile.value.left.value }} </span><span class="tile-suffix-left"> {{ tile.value.left.suffix }}</span></div>
            <div style="position: absolute;top: 62px;left: 104px;font-size: 20px;"><span class="tile-value-right">{{ tile.value.right.value }} </span><span class="tile-suffix-right"> {{ tile.value.right.suffix }}</span></div>
        </div>
        <div class="tile-touch-layer"></div>
    </div>
</div>
